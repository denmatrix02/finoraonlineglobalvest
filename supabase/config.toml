[project]
# Replace with your Finora Supabase project ref once created
id = "finora-project-id"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "https://finoraglobalvest.org"
additional_redirect_urls = ["https://finoraglobalvest.org", "https://www.finoraglobalvest.org", "https://finoraonlineglobalvest.vercel.app", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[functions.request-transfer-otp]
verify_jwt = true

[functions.verify-transfer-otp]
verify_jwt = true
